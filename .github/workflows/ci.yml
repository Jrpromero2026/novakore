# NovaKore CI — the verify gate, enforced on every push and pull request.
# Mirrors `npm run verify` (format:check → lint → typecheck → unit tests →
# build). The real-database RLS suite runs only when the repository secrets
# are configured, so forks and secretless contexts stay green-by-skip while
# the canonical repo gets full coverage.
#
# Owner setup (one-time, documented in docs/operations/runbook.md):
#   1. Repo → Settings → Secrets and variables → Actions — ALL THREE:
#        NOVAKORE_TEST_SUPABASE_URL
#        NOVAKORE_TEST_SUPABASE_ANON_KEY
#        NOVAKORE_TEST_PASSWORD
#      Values live in the gitignored .env.test.local. Setting only the first
#      two enables the RLS suite but leaves the browser suite skipping in
#      silence, which reads as coverage that is not running.
#   2. Repo → Settings → Branches → protect `main`:
#        require the "verify" check before merging.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run the gate on demand from the Actions tab. Needed because the
  # real-database steps depend on repository secrets and on the state of the
  # dev project, so a run can go red for reasons that have nothing to do with
  # the commit — a rotated password, a rate-limited sign-in. Without this the
  # only way to re-verify unchanged code is an empty commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (web · authz · domain · design-system)
        run: |
          npm run test:run --workspace=@novakore/web
          npm run test:run --workspace=@novakore/authorization
          npm run test:run --workspace=@novakore/domain
          npm run test:run --workspace=@novakore/design-system

      - name: Validate real-database secrets
        # A secret that exists but is malformed is worse than one that is
        # missing: the skip guards test only for emptiness, so a wrong value
        # sails past them and fails later as `Invalid supabaseUrl` from inside
        # the Supabase client, with a stack trace into node_modules that says
        # nothing about the cause. The commonest mistake is pasting a whole
        # line from .env.test.local, variable name and "=" included.
        #
        # Malformed is treated as NOT CONFIGURED, not as a build failure.
        # These suites were always opt-in — absent secrets skip and stay
        # green, so that forks and secretless contexts are not punished for a
        # configuration they cannot supply. A half-finished setup is the same
        # situation and gets the same answer: skip loudly, stay green. Failing
        # the build instead would leave a permanently red pipeline that says
        # nothing about the code, which is how a team learns to ignore it.
        #
        # Shapes only. Values are never echoed; GitHub would mask them, but
        # a log that cannot leak is better than one that relies on masking.
        env:
          URL: ${{ secrets.NOVAKORE_TEST_SUPABASE_URL }}
          KEY: ${{ secrets.NOVAKORE_TEST_SUPABASE_ANON_KEY }}
          PW: ${{ secrets.NOVAKORE_TEST_PASSWORD }}
        run: |
          usable=true
          if [ -z "$URL" ] || [ -z "$KEY" ] || [ -z "$PW" ]; then
            usable=false
          fi
          if [ -n "$URL" ] && ! printf '%s' "$URL" | grep -Eq '^https://[a-z0-9]+\.supabase\.co/?$'; then
            echo "::warning title=Malformed secret::NOVAKORE_TEST_SUPABASE_URL is set but is not a Supabase URL. Expected exactly https://<project-ref>.supabase.co — copy only the value after the '=' in .env.test.local, with no variable name, quotes, or trailing newline."
            usable=false
          fi
          if [ -n "$KEY" ] && ! printf '%s' "$KEY" | grep -Eq '^eyJ'; then
            echo "::warning title=Malformed secret::NOVAKORE_TEST_SUPABASE_ANON_KEY does not look like a JWT (expected it to start with 'eyJ'). Copy only the value after the '='."
            usable=false
          fi
          case "$PW" in
            NOVAKORE_TEST_PASSWORD=*)
              echo "::warning title=Malformed secret::NOVAKORE_TEST_PASSWORD still contains the variable name. Copy only the value after the '='."
              usable=false ;;
          esac
          echo "REAL_DB_SECRETS_USABLE=$usable" >> "$GITHUB_ENV"
          if [ "$usable" = "true" ]; then
            echo "Real-database secrets present and well-formed."
          else
            echo "::warning::Real-database and browser suites will be SKIPPED. They run locally via 'npm run test:rls' and 'npm run test:e2e'."
          fi

      - name: Real-database RLS tests
        # Runs only when the live-DB secrets exist; otherwise skipped loudly.
        env:
          NOVAKORE_TEST_SUPABASE_URL: ${{ secrets.NOVAKORE_TEST_SUPABASE_URL }}
          NOVAKORE_TEST_SUPABASE_ANON_KEY: ${{ secrets.NOVAKORE_TEST_SUPABASE_ANON_KEY }}
          # The dev database is rotated away from the public seed literal, so
          # this secret is required for the suite to authenticate.
          NOVAKORE_TEST_PASSWORD: ${{ secrets.NOVAKORE_TEST_PASSWORD }}
        run: |
          if [ "$REAL_DB_SECRETS_USABLE" != "true" ]; then
            echo "::warning::Real-DB secrets not usable — RLS suite SKIPPED (134 tests). See the validation step above."
          else
            npm run test:rls
          fi

      - name: Production build
        env:
          # Build-time inline of public values; placeholders keep the build
          # honest when repo secrets are absent (zod requires ≥20 chars).
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NOVAKORE_TEST_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NOVAKORE_TEST_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key-0000000000' }}
        run: |
          # A malformed secret is long enough to satisfy the length check and
          # still be wrong, which would fail the build for a reason that has
          # nothing to do with the commit. Fall back to the placeholders the
          # secretless path already uses.
          if [ "$REAL_DB_SECRETS_USABLE" != "true" ]; then
            export NEXT_PUBLIC_SUPABASE_URL="https://ci-placeholder.supabase.co"
            export NEXT_PUBLIC_SUPABASE_ANON_KEY="ci-placeholder-anon-key-0000000000"
          fi
          npm run build

      - name: End-to-end happy path (real browser)
        # Exercises the journey a customer takes: anonymous refusal → sign-in
        # → Command Center → Studio → Knowledge IDE → Intelligence → learner
        # Academy → public credential verification. Read-only by design.
        #
        # Also the shell guarantees that only a real browser can check, each
        # added after a defect reached main: every domain and card link
        # resolves, detail pages carry a trail, the skip link moves focus, no
        # page scrolls sideways at 375px, and text meets AA contrast in both
        # colour schemes (measured from computed pixels, not from the CSS).
        #
        # The suite signs in several times against the shared dev project,
        # which rate-limits auth. It runs single-worker for that reason. If
        # this step starts failing on sign-in rather than on an assertion,
        # that is the cause — reuse a stored session before adding retries.
        env:
          NOVAKORE_TEST_SUPABASE_URL: ${{ secrets.NOVAKORE_TEST_SUPABASE_URL }}
          NOVAKORE_TEST_SUPABASE_ANON_KEY: ${{ secrets.NOVAKORE_TEST_SUPABASE_ANON_KEY }}
          NOVAKORE_TEST_PASSWORD: ${{ secrets.NOVAKORE_TEST_PASSWORD }}
        run: |
          if [ "$REAL_DB_SECRETS_USABLE" != "true" ]; then
            echo "::warning::E2E SKIPPED — credentials not usable. See the validation step above."
          else
            npx playwright install --with-deps chromium
            npm run test:e2e
          fi

      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Artifact validation
        run: |
          test -d apps/web/.next || (echo "::error::.next output missing" && exit 1)
          node scripts/db-types.mjs --check || echo "::warning::Generated DB types drift from committed types — run npm run db:types"
